name: Release

# Push a tag like v1.2.0 to build, publish a GitHub release and update the Homebrew cask.
# Optional secrets: DEVELOPER_ID_P12_BASE64, DEVELOPER_ID_P12_PASSWORD (Developer ID signing),
# NOTARY_KEY_BASE64, NOTARY_KEY_ID, NOTARY_ISSUER_ID (notarization), TAP_DEPLOY_KEY (cask update).
# scripts/setup-release-signing.sh creates all of them.
# Without them the release is ad-hoc signed and the cask must be updated by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build number = commit count
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Test
        run: swift test
      - name: Import Developer ID certificate
        id: signing
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: scripts/ci/import-signing-cert.sh
      - name: Package universal app (signed and notarized when secrets are set)
        env:
          CODESIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: scripts/package-release.sh "${GITHUB_REF_NAME#v}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "build/Overtone-$version.zip" "build/Overtone-$version.zip.sha256" \
            --title "Overtone $version" --generate-notes
      - name: Update Homebrew tap
        env:
          # Private half of a write deploy key on TobiasPol/homebrew-tap (scripts/setup-release-signing.sh).
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "TAP_DEPLOY_KEY is not set; update the cask manually with scripts/update-cask.sh"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          key="$RUNNER_TEMP/tap_deploy_key"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:TobiasPol/homebrew-tap.git tap
          notarized=0
          if xcrun stapler validate -q build/Overtone.app; then notarized=1; fi
          NOTARIZED=$notarized scripts/update-cask.sh "$version" "$(cat "build/Overtone-$version.zip.sha256")" tap
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/overtone.rb
          git commit -m "overtone $version"
          git push
          rm -f "$key"
