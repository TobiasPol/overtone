name: Release

# Push a tag like v1.2.0 to build, publish a GitHub release and update the Homebrew cask.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build number = commit count
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Test
        run: swift test
      - name: Package universal app
        run: scripts/package-release.sh "${GITHUB_REF_NAME#v}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "build/Overtone-$version.zip" "build/Overtone-$version.zip.sha256" \
            --title "Overtone $version" --generate-notes
      - name: Update Homebrew tap
        env:
          # Fine-grained token with Contents: read/write on TobiasPol/homebrew-tap.
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_GITHUB_TOKEN is not set; update the cask manually with scripts/update-cask.sh"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/TobiasPol/homebrew-tap.git" tap
          scripts/update-cask.sh "$version" "$(cat "build/Overtone-$version.zip.sha256")" tap
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/overtone.rb
          git commit -m "overtone $version"
          git push
