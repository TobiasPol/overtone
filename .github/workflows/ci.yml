name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Quality gates (build, tests, size limits)
        run: scripts/check.sh
      - name: Build app bundle
        run: scripts/build-app.sh release
      - uses: actions/upload-artifact@v4
        with:
          name: Overtone.app
          path: build/Overtone.app
